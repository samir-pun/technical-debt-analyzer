<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Technical Debt Analyzer{% endblock %}</title>
  <style>
    :root {
      --blue: #3b5bdb; --blue-dark: #2f4ac0; --ink: #1b2330; --muted: #5d6b7e;
      --line: #e3e8ef; --bg: #f6f8fb; --card: #ffffff;
      --low: #1f9d55; --medium: #d98a00; --high: #d92d20;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    nav { background: var(--card); border-bottom: 1px solid var(--line); }
    .nav-inner { max-width: 1040px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 800; font-size: 18px; color: var(--ink); text-decoration: none; }
    .brand span { color: var(--blue); }
    .nav-tag { font-size: 13px; color: var(--muted); }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 56px; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0 36px; }

    .hero { text-align: center; padding: 28px 0 24px; }
    .hero h1 { font-size: 34px; margin: 0 0 10px; }
    .hero p { color: var(--muted); max-width: 640px; margin: 0 auto; font-size: 17px; }

    .dropzone { display: block; border: 2px dashed #b9c4d6; border-radius: 14px; background: var(--card); padding: 48px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
    .dropzone:hover, .dropzone.over { border-color: var(--blue); background: #f0f3ff; }
    .dz-title { display: inline-block; background: var(--blue); color: #fff; font-weight: 600; padding: 10px 22px; border-radius: 8px; margin-bottom: 12px; }
    .dz-sub { color: var(--muted); word-break: break-all; }
    .actions { text-align: center; margin-top: 16px; }

    .btn { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: var(--blue-dark); }
    .btn:disabled { background: #b9c4d6; cursor: not-allowed; }

    h2.section { text-align: center; font-size: 24px; margin: 48px 0 6px; }
    .section-sub { text-align: center; color: var(--muted); margin: 0 0 22px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    .card h3 { margin: 0 0 6px; font-size: 17px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }

    details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
    summary { cursor: pointer; font-weight: 600; }
    details p, details ul { color: var(--muted); font-size: 14px; }

    .error { background: #fdecea; color: #b42318; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }

    .page-title { margin: 0 0 18px; font-size: 26px; }
    .stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 20px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .stat-value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .c-high { color: var(--high); }
    .c-medium { color: var(--medium); }
    .c-low { color: var(--low); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 20px; }
    .panel h3 { margin: 0 0 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    td.file { white-space: normal; word-break: break-all; }

    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
    .badge.LOW, .badge.PASS { background: var(--low); }
    .badge.MEDIUM { background: var(--medium); }
    .badge.HIGH, .badge.FAIL { background: var(--high); }
    .bar { width: 110px; height: 8px; background: #e8ecf3; border-radius: 99px; overflow: hidden; }
    .bar span { display: block; height: 100%; }
    .bar.LOW span { background: var(--low); }
    .bar.MEDIUM span { background: var(--medium); }
    .bar.HIGH span { background: var(--high); }
    .chip { display: inline-block; background: #eef1f8; border-radius: 999px; padding: 2px 10px; font-size: 12px; margin: 0 6px 6px 0; color: var(--ink); }

    .overlay { position: fixed; inset: 0; background: rgba(255,255,255,.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
    .overlay.show { display: flex; }
    .spinner { width: 46px; height: 46px; border: 5px solid #d7dffa; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a class="brand" href="/">Debt<span>Analyzer</span></a>
      <span class="nav-tag">Static analysis + machine learning for Python</span>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Final year project, University of Bedfordshire</footer>

  <div id="loading" class="overlay">
    <div class="spinner"></div>
    <p>Analysing your project. Large projects can take a minute.</p>
  </div>
</body>
</html>
