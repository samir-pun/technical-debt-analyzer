<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Technical Debt Analyzer{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #1f2933; }
    header { background: #1f2933; color: #fff; padding: 16px 32px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; color: #9aa5b1; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .error { background: #fdecea; color: #b42318; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e4e7eb; font-size: 14px; }
    th { color: #52606d; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; color: #fff; }
    .LOW, .PASS { background: #2e9e5b; }
    .MEDIUM { background: #d98e04; }
    .HIGH, .FAIL { background: #d92d20; }
    button { background: #1f2933; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <header>
    <h1>Technical Debt Analyzer</h1>
    <p>Static analysis + machine learning risk prediction for Python code</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
