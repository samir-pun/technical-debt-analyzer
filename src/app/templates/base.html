<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Technical Debt Analyzer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav>
    <div class="nav-inner">
      <a class="brand" href="/">Debt<span>Analyzer</span></a>
      <span class="nav-tag">Static analysis + machine learning for Python</span>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Final year project, University of Bedfordshire</footer>

  <div id="loading" class="overlay">
    <div class="spinner"></div>
    <p>Analysing your project. Large projects can take a minute.</p>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
